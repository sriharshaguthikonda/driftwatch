name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Runs before install so a leaked capture fails fast and cheap.
      - run: node tools/check-no-captures.mjs
      - run: npm install
      - run: npm test
